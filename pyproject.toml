[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vivado-sweeper"
version = "0.1.0"
description = "Parameter sweeps for Vivado projects: edit `define values, build, collect timing/utilization/power."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["vivado", "fpga", "xilinx", "amd", "sweep", "design-space-exploration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/shiuintw/vivado-sweeper"
Repository = "https://github.com/shiuintw/vivado-sweeper.git"
Issues = "https://github.com/shiuintw/vivado-sweeper/issues"

[project.scripts]
vsweep = "vivado_sweeper.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vivado_sweeper = ["tcl/*.tcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
